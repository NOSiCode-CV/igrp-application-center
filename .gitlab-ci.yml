image: docker:28.2.2
services:
  - name: docker:28.2.2-dind
    command: [ "--tls=false", "--mtu=1240" ]
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  DOCKER_HOST: tcp://docker:2375
  DOCKER_REGISTRY: registry.nosi.cv
  DOCKER_PROJECT: igrp
  IMAGE_NAME: igrp-application-center
  IMAGE_NAME_FULL: "$DOCKER_REGISTRY/$DOCKER_PROJECT/$IMAGE_NAME"

stages:
  - validate
  - build
  - manifest
  - deploy

# =============================================
#  Release pipelines (NOSi Registry - multi-arch)
#
#  Branch  deploy/pre-release  -> tag  pre-release
#  Branch  deploy/0.1.0-beta   -> tag  0.1.0-beta
#  Branch  deploy/0.2.0-beta   -> tags 0.2.0-beta + latest
#
#  No pipeline runs on the mainline branch.
# =============================================

# Enforced gate: shadcn/UI rules must stay clean. Blocks merges.
check-ui:
  stage: validate
  image: node:22-alpine
  tags:
    - nosi-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm check:ui

# Advisory: surfaces lint/typecheck/test status without blocking.
validate:
  stage: validate
  image: node:22-alpine
  tags:
    - nosi-runner
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  allow_failure: true
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm typecheck
    - pnpm test

.release-rules: &release-rules
  - if: '$CI_COMMIT_BRANCH == "deploy/pre-release"'
  - if: '$CI_COMMIT_BRANCH == "deploy/0.1.0-beta"'
  - if: '$CI_COMMIT_BRANCH == "deploy/0.2.0-beta"'

build-arm64:
  stage: build
  tags:
    - arm64
  rules: *release-rules
  before_script:
    - apk add --no-cache curl bash
    - docker login -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD" "$DOCKER_REGISTRY"
  script:
    - docker buildx create --use --name amd64builder || true
    - docker buildx inspect --bootstrap
    - docker build --build-arg SPRING_PROFILES_ACTIVE=$SPRING_PROFILES_ACTIVE --platform linux/arm64 -t "$IMAGE_NAME_FULL:arm64-$CI_COMMIT_REF_SLUG" --push --output=type=image,name="$IMAGE_NAME_FULL:arm64-$CI_COMMIT_REF_SLUG",push=true .

build-amd64:
  stage: build
  tags:
    - nosi-runner
  rules: *release-rules
  before_script:
    - apk add --no-cache curl bash
    - docker login -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD" "$DOCKER_REGISTRY"
  script:
    - docker buildx create --use --name amd64builder || true
    - docker buildx inspect --bootstrap
    - docker build --build-arg SPRING_PROFILES_ACTIVE=$SPRING_PROFILES_ACTIVE --platform linux/amd64 -t "$IMAGE_NAME_FULL:amd64-$CI_COMMIT_REF_SLUG" --push --output=type=image,name="$IMAGE_NAME_FULL:amd64-$CI_COMMIT_REF_SLUG",push=true .

create-manifest:
  stage: manifest
  tags:
    - nosi-runner
  needs:
    - build-amd64
    - build-arm64
  rules:
    - if: '$CI_COMMIT_BRANCH == "deploy/pre-release"'
      variables:
        RELEASE_TAG: "pre-release"
    - if: '$CI_COMMIT_BRANCH == "deploy/0.1.0-beta"'
      variables:
        RELEASE_TAG: "0.1.0-beta"
    - if: '$CI_COMMIT_BRANCH == "deploy/0.2.0-beta"'
      variables:
        RELEASE_TAG: "0.2.0-beta"
  before_script:
    - docker login -u "$DOCKER_REGISTRY_USERNAME" -p "$DOCKER_REGISTRY_PASSWORD" "$DOCKER_REGISTRY"
  script:
    - docker manifest create "$IMAGE_NAME_FULL:$RELEASE_TAG" --amend "$IMAGE_NAME_FULL:arm64-$CI_COMMIT_REF_SLUG" --amend "$IMAGE_NAME_FULL:amd64-$CI_COMMIT_REF_SLUG"
    - docker manifest push "$IMAGE_NAME_FULL:$RELEASE_TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "deploy/0.2.0-beta" ]; then
        docker manifest create "$IMAGE_NAME_FULL:latest" --amend "$IMAGE_NAME_FULL:arm64-$CI_COMMIT_REF_SLUG" --amend "$IMAGE_NAME_FULL:amd64-$CI_COMMIT_REF_SLUG"
        docker manifest push "$IMAGE_NAME_FULL:latest"
      fi

deploy_dev:
  image: gcc:latest
  stage: deploy
  only:
    - env-dev
  script:
    - |
      curl -u "$DEPLOY_USER_DEV:$DEPLOY_PASSWORD_DEV" \
        -X POST \
        -H 'Accept: application/json' \
        -H 'Content-Type: application/json' \
        'https://manager.nosi.cv/v3/project/c-m-2dwvbm6l:p-ftmmp/workloads/deployment:integration-hub:igrp-application-center?action=redeploy'
